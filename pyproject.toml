[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pydeck26"
version = "0.1.0"
description = "A persistent cockpit for Python projects following Lion's 2026 structure."
requires-python = ">=3.10"
license = {text = "CC0-1.0"}
readme = "README.md"
dependencies = [
    "lionscliapp",
]

[project.scripts]
pydeck26 = "pydeck26.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
